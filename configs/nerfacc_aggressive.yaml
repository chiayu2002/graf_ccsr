expname: RS307_nerfacc_aggressive
data:
  datadir: [data/RS307_n]
  far: 4.5
  fov: 20
  imsize: 256
  near: 1.5
  orthographic: False
  use_default_rays : False
  radius: 2.5
  type: RS307_0_i2
  umax: 1.
  umin: 0.
  vmax: 0.5
  vmin: 0.
  v: 0.5, 0.4, 0.3, 0.2
discriminator:
  num_classes: 1
  hflip: false
  ndf: 64
nerf:
  N_samples: 64
  decrease_noise: true
  i_embed: 0
  multires: 10
  multires_views: 4
  netdepth: 8
  netwidth: 256
  perturb: 1.0
  raw_noise_std: 0.1
  use_viewdirs: true
  N_importance: 0
  netdepth_fine: 8
  netwidth_fine: 256
ray_sampler:
  N_samples: 4096
  max_scale: 1.0
  min_scale: 0.25
  scale_anneal: 0.0025
training:
  backup_every: 50000
  batch_size: 8
  chunk: 32768
  equalize_lr: false
  fid_every: 5000
  gan_type: standard
  lr_anneal: 0.5
  lr_anneal_every: 80000,120000,150000
  lr_d: 0.00002
  lr_g: 0.0008
  model_average_beta: 0.999
  model_average_reinit: false
  model_file: model.pt
  netchunk: 65536
  nworkers: 0
  optimizer: rmsprop
  outdir: ./results
  print_every: 10
  reg_param: 20.0
  restart_every: -1
  sample_every: 500
  save_best: fid
  save_every: 1000
  take_model_average: true
z_dist:
  dim: 256
  type: gauss
ccsr:
    enabled: False
    num_views: 8,
    scale_factor: 4,
    alpha_init: 1.0,
    alpha_decay: 0.0001
wandb:
  project: graf251105
  entity: vicky20020808
  name: RS307_nerfacc_aggressive
nerfacc:
  use_nerfacc: true
  resolution: 16              # 🔧 AGGRESSIVE: 24 → 16 (更快的 grid 查詢)
                              # 16³ = 4,096 個點（vs 24³ = 13,824）
  render_step_size: 0.2       # 🔧 AGGRESSIVE: 0.12 → 0.2 (更大步長 = 更少初始採樣)

# ⚡ AGGRESSIVE 優化配置
# 目標：犧牲一些質量來最大化速度
#
# 參數說明：
# - resolution: 16（非常小的 grid，最快的查詢速度）
# - render_step_size: 0.2（大步長，減少初始樣本數）
# - alpha_thre: 0.05（在代碼中設置，更激進的裁剪）
#
# 預期結果：
# - estimator.sampling: ~30-40ms（從 75ms 再降低）
# - 樣本減少: 75-80%（從 50-65% 提升）
# - 整體速度: 80-120 it/min（目標是 2-3× 加速）
#
# 如果質量下降太多，可以逐步調整：
# - resolution: 16 → 20
# - render_step_size: 0.2 → 0.15
