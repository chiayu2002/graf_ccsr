expname: RS307_nerfacc_optimized
data:
  datadir: [data/RS307_n]
  far: 4.5
  fov: 20
  imsize: 256
  near: 1.5
  orthographic: False
  use_default_rays : False
  radius: 2.5
  type: RS307_0_i2
  umax: 1.
  umin: 0.
  vmax: 0.5
  vmin: 0.
  v: 0.5, 0.4, 0.3, 0.2
discriminator:
  num_classes: 1
  hflip: false
  ndf: 64
nerf:
  N_samples: 64
  decrease_noise: true
  i_embed: 0
  multires: 10
  multires_views: 4
  netdepth: 8
  netwidth: 256
  perturb: 1.0
  raw_noise_std: 0.1
  use_viewdirs: true
  N_importance: 0
  netdepth_fine: 8
  netwidth_fine: 256
ray_sampler:
  N_samples: 4096
  max_scale: 1.0
  min_scale: 0.25
  scale_anneal: 0.0025
training:
  backup_every: 50000
  batch_size: 8
  chunk: 32768
  equalize_lr: false
  fid_every: 5000
  gan_type: standard
  lr_anneal: 0.5
  lr_anneal_every: 80000,120000,150000
  lr_d: 0.00002
  lr_g: 0.0008
  model_average_beta: 0.999
  model_average_reinit: false
  model_file: model.pt
  netchunk: 65536
  nworkers: 0
  optimizer: rmsprop
  outdir: ./results
  print_every: 10
  reg_param: 20.0
  restart_every: -1
  sample_every: 500
  save_best: fid
  save_every: 1000
  take_model_average: true
z_dist:
  dim: 256
  type: gauss
ccsr:
    enabled: False  # 暫時禁用 CCSR
    num_views: 8,
    scale_factor: 4,
    alpha_init: 1.0,
    alpha_decay: 0.0001
wandb:
  project: graf251105
  entity: vicky20020808
  name: RS307_nerfacc_optimized
nerfacc:
  use_nerfacc: true           # ✅ 啟用 NerfAcc
  resolution: 64              # 🔧 降低解析度（從 128 降到 64）- 減少 8× 的計算量
                              # 64³ = 262,144 個點（vs 128³ = 2,097,152）
  render_step_size: null      # 自動計算

# ⚡ 優化說明：
# 1. Grid resolution: 128 → 64 (減少 8× 計算量)
# 2. Update interval: 16 → 128 (在 train.py 中設定，減少 8× 更新頻率)
# 3. n_views: 4 → 1 (在 generator.py 中已修改，減少 4× 計算量)
#
# 總計減少開銷: 8 × 8 × 4 = 256×
# 預期效果: 應該能看到明顯加速（1.5-2× faster）
