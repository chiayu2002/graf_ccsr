expname: column251201_test_noacc
data:
  datadir: [data/RS307_n]
  far: 4.5
  fov: 20
  imsize: 256  
  near: 1.5
  orthographic: False
  use_default_rays : False
  radius: 2.5
  type: RS307_0_i2
  umax: 1.
  umin: 0.
  vmax: 0.5
  vmin: 0.
  # v: 0.5, 0.4166667, 0.3833333, 0.3333334, 0.25, 0.21666667  #, 0.1666667, 0.1166667
  # v: 0.5, 0.4166667, 0.3333334, 0.25  #, 0.1666667  #90 80.406 70.529 60 48.19   0.5, 0.4, 0.3, 0.2
  # v: 0.5, 0.36, 0.4, 0.3, 0.2, 0.16, 0.1
  v: 0.5, 0.4, 0.3, 0.2 
discriminator:
  num_classes: 1   
  hflip: false
  ndf: 64 #64 #128
nerf:
  N_samples: 64
  decrease_noise: true
  i_embed: 0
  multires: 10
  multires_views: 4
  netdepth: 8
  netwidth: 256
  perturb: 1.0
  raw_noise_std: 0.1  # 降低噪聲（從1.0降到0.1），讓訓練更穩定
  use_viewdirs: true
  N_importance: 0
  netdepth_fine: 8
  netwidth_fine: 256
ray_sampler:
  N_samples: 4096 #1024 #4096
  max_scale: 1.0
  min_scale: 0.25
  scale_anneal: 0.0025
training:
  backup_every: 50000
  batch_size: 8
  chunk: 32768 #131072
  equalize_lr: false
  fid_every: 5000
  gan_type: standard
  lr_anneal: 0.5
  lr_anneal_every: 80000,120000,150000
  lr_d: 0.00002  # 大幅降低Discriminator學習率（從0.00005降到0.00002）
  lr_g: 0.0008    # 提高Generator學習率（從0.0006提高到0.0008）
  model_average_beta: 0.999
  model_average_reinit: false
  model_file: model.pt
  netchunk: 65536 #262144
  nworkers: 0
  optimizer: rmsprop
  outdir: ./results
  print_every: 10
  reg_param: 20.0  # 進一步降低梯度懲罰（從40降到20）
  restart_every: -1
  sample_every: 500
  save_best: fid
  save_every: 1000
  take_model_average: true
z_dist:
  dim: 256
  # dim_appearance: 128 
  type: gauss
ccsr:
    enabled: False  # ⚠️ 暫時完全禁用 CCSR - 先讓 GRAF 本身能正常訓練
    num_views: 8,
    scale_factor: 4,
    alpha_init: 1.0,
    alpha_decay: 0.0001
wandb:
  project: graf251105
  entity: vicky20020808
  name: RS307_test_noacc
nerfacc:
  use_nerfacc: false       # ⚠️ 暫時禁用 NerfAcc - 先確認模型能正常訓練
  resolution: 128          # Occupancy grid 解析度 (推薦: 128, 可選: 64, 256)
                           # 越高越精確但記憶體佔用越大
  render_step_size: null   # null = 自動計算 (far-near)/N_samples
                           # 或手動指定: 0.047 = (4.5-1.5)/64

# 注意：當前訓練結果不佳，暫時禁用 NerfAcc 以排查問題
# 等模型能生成清晰圖像後，再逐步啟用 NerfAcc 加速