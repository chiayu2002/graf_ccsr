expname: RS307_nerfacc_ultra_stable
data:
  datadir: [data/RS307_n]
  far: 4.5
  fov: 20
  imsize: 256
  near: 1.5
  orthographic: False
  use_default_rays : False
  radius: 2.5
  type: RS307_0_i2
  umax: 1.
  umin: 0.
  vmax: 0.5
  vmin: 0.
  v: 0.5, 0.4, 0.3, 0.2
discriminator:
  num_classes: 1
  hflip: false
  ndf: 64
nerf:
  N_samples: 64
  decrease_noise: true
  i_embed: 0
  multires: 10
  multires_views: 4
  netdepth: 8
  netwidth: 256
  perturb: 1.0
  raw_noise_std: 0.05          # 🔧 降低噪声 (0.1 → 0.05)
  use_viewdirs: true
  N_importance: 0
  netdepth_fine: 8
  netwidth_fine: 256
ray_sampler:
  N_samples: 4096
  max_scale: 1.0
  min_scale: 0.25
  scale_anneal: 0.0025
training:
  backup_every: 50000
  batch_size: 8
  chunk: 32768
  equalize_lr: false
  fid_every: 5000
  gan_type: standard
  lr_anneal: 0.5
  lr_anneal_every: 80000,120000,150000
  lr_d: 0.000005           # 🔧 ULTRA STABLE: 进一步降低 (0.00001 → 0.000005)
  lr_g: 0.0002             # 🔧 ULTRA STABLE: 进一步降低 (0.0004 → 0.0002)
  model_average_beta: 0.999
  model_average_reinit: false
  model_file: model.pt
  netchunk: 65536
  nworkers: 0
  optimizer: rmsprop
  outdir: ./results
  print_every: 10
  reg_param: 10.0          # 🔧 降低梯度惩罚 (20.0 → 10.0)
  restart_every: -1
  sample_every: 500
  save_best: fid
  save_every: 1000
  take_model_average: true
  grad_clip: 0.5           # 🔧 更激进的梯度裁剪 (1.0 → 0.5)
z_dist:
  dim: 256
  type: gauss
ccsr:
    enabled: False
    num_views: 8,
    scale_factor: 4,
    alpha_init: 1.0,
    alpha_decay: 0.0001
wandb:
  project: graf251105
  entity: vicky20020808
  name: RS307_nerfacc_ultra_stable
nerfacc:
  use_nerfacc: true
  resolution: 40              # 🔧 提高质量 (32 → 40)
  render_step_size: 0.06      # 🔧 更密集采样 (0.08 → 0.06)
  occ_grid_update_interval: 128

# ⚡ 超稳定配置 - 修复训练崩溃和黑线
#
# 问题：训练完全不稳定，Generator loss 在 2-5 之间波动
# 原因：学习率太高 + NerfAcc 可能仍太激进
#
# 关键修改：
# 1. lr_g: 0.0004 → 0.0002 (再降低 50%)
# 2. lr_d: 0.00001 → 0.000005 (再降低 50%)
# 3. grad_clip: 1.0 → 0.5 (更激进的裁剪)
# 4. resolution: 32 → 40 (更高质量，减少黑线)
# 5. render_step_size: 0.08 → 0.06 (更密集采样)
# 6. raw_noise_std: 0.1 → 0.05 (降低 NeRF 噪声)
# 7. reg_param: 20.0 → 10.0 (降低梯度惩罚强度)
# 8. alpha_thre: 在代码中改为 0.005 (最保守)
#
# 预期效果：
# - Generator loss: 从初始的 ~11 平稳下降到 <2
# - 无剧烈波动
# - 图像清晰，无黑线
# - 训练速度：~45-47 it/min (略慢但稳定)
