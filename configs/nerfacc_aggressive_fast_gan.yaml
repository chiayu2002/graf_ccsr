expname: RS307_nerfacc_aggressive_fast_gan
data:
  datadir: [data/RS307_n]
  far: 4.5
  fov: 20
  imsize: 256
  near: 1.5
  orthographic: False
  use_default_rays : False
  radius: 2.5
  type: RS307_0_i2
  umax: 1.
  umin: 0.
  vmax: 0.5
  vmin: 0.
  v: 0.5, 0.4, 0.3, 0.2
discriminator:
  num_classes: 1
  hflip: false
  ndf: 48              # 🔧 GAN 優化：64 → 48 (減少 ~40% 參數)
nerf:
  N_samples: 64
  decrease_noise: true
  i_embed: 0
  multires: 10
  multires_views: 4
  netdepth: 8
  netwidth: 256
  perturb: 1.0
  raw_noise_std: 0.1
  use_viewdirs: true
  N_importance: 0
  netdepth_fine: 8
  netwidth_fine: 256
ray_sampler:
  N_samples: 4096
  max_scale: 1.0
  min_scale: 0.25
  scale_anneal: 0.0025
training:
  backup_every: 50000
  batch_size: 8
  chunk: 32768
  equalize_lr: false
  fid_every: 5000
  gan_type: standard
  lr_anneal: 0.5
  lr_anneal_every: 80000,120000,150000
  lr_d: 0.00002
  lr_g: 0.0008
  model_average_beta: 0.999
  model_average_reinit: false
  model_file: model.pt
  netchunk: 65536
  nworkers: 0
  optimizer: rmsprop
  outdir: ./results
  print_every: 10
  reg_param: 20.0      # 🔧 梯度懲罰權重（保持不變）
  reg_every: 2         # 🔧 NEW: 每 2 步計算一次梯度懲罰（減少 50% 開銷）
  restart_every: -1
  sample_every: 500
  save_best: fid
  save_every: 1000
  take_model_average: true
  use_amp: true        # 🔧 NEW: 啟用混合精度訓練
z_dist:
  dim: 256
  type: gauss
ccsr:
    enabled: False
    num_views: 8,
    scale_factor: 4,
    alpha_init: 1.0,
    alpha_decay: 0.0001
wandb:
  project: graf251105
  entity: vicky20020808
  name: RS307_nerfacc_aggressive_fast_gan
nerfacc:
  use_nerfacc: true
  resolution: 16
  render_step_size: 0.2
  occ_grid_update_interval: 128

# ⚡ GAN 優化配置
#
# 優化 1: 降低 Discriminator 參數
#   - ndf: 64 → 48 (減少 ~40% 參數)
#   - 預期加速: 15-20%
#
# 優化 2: 混合精度訓練
#   - use_amp: true
#   - 預期加速: 20-30%
#   - 注意: 可能需要調整學習率
#
# 優化 3: 降低梯度懲罰頻率
#   - reg_every: 2 (每 2 步計算一次)
#   - 預期加速: 10-15%
#
# 總預期加速: 45-65% (相對於優化前)
# 預期速度: 75-85 it/min
